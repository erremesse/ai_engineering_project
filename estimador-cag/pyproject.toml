[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.105.2",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    # 1.82.7 and 1.82.8 were supply-chain compromised (March 2026) — exclude them
    "litellm>=1.34.0,!=1.82.7,!=1.82.8",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "structlog>=24.0",
    "uvicorn[standard]>=0.48.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # Cross-encoder reranker (Sesion 10). Pulls torch transitively; loaded lazily
    # (app/retrieval/reranker.py) so importing the package costs nothing unless
    # RAG_RERANK_ENABLED=true actually triggers a model load.
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "anyio[trio]>=4.0"]

# CPU-only torch: the default PyPI wheel pulls the full CUDA toolkit (~3GB of
# nvidia-cu* packages) that a small CPU cross-encoder never uses. This service
# has no GPU, in Docker or otherwise, so redirect torch to the CPU-only index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
