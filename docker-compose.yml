# Estimador — orquestacion local (Sesion 15). Arranque: docker compose up -d
#
#   usuario -> business-backend (:3000, unico puerto publico)
#                 |-> postgres       (historial de estimaciones)
#                 '-> ai-service     (solo red interna, X-Service-Token)
#                        '-> vector-db (pgvector: documents/chunks)
#
# Guia y comprobaciones: docs/deployment-local.md

# Fixed project name: keeps the volume names (estimador-cag_*) from before the
# repo was restructured, so the already-ingested corpus is not lost.
name: estimador-cag

services:
  business-backend:
    build: ./business-backend
    ports:
      - "3000:3000"            # public entry point — the ONLY published port
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-estimation}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set in .env}
      ESTIMATE_API_KEY: ${ESTIMATE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    # No "ports:" on purpose — internal only, not reachable from the host.
    env_file:
      - .env                   # LLM provider keys/models, RAG_* tuning
    environment:
      DATABASE_URL: postgresql+asyncpg://${VECTOR_DB_USER:-estimator}:${VECTOR_DB_PASSWORD:-estimator}@vector-db:5432/${VECTOR_DB_NAME:-estimator}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set in .env}
      # Sesion 16: one JSON line per estimation request (latency, tokens, cost,
      # status), read by ai-service/eval/dashboard.py. See docs/evaluation.md.
      METRICS_LOG_PATH: /app/metrics/estimate_requests.jsonl
    volumes:
      - hf_cache:/app/.cache/huggingface
      - metrics_data:/app/metrics
    depends_on:
      vector-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-estimation}
    volumes:
      - business_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-estimation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER:-estimator}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-estimator}
      POSTGRES_DB: ${VECTOR_DB_NAME:-estimator}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # historical name: holds the ingested corpus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_DB_USER:-estimator} -d ${VECTOR_DB_NAME:-estimator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  business_postgres_data:
  hf_cache:
  metrics_data:
